[workspace]
resolver = "3"
members = [
  "crates/cowork-core",
  "crates/cowork-runtime",
  "crates/broker-transport",
  "crates/opencode-client",
  "crates/process-supervisor",
  "apps/desktop/src-tauri",
  "tools/docx-tool",
  "tools/broker-host",
  "tools/broker-proof",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "stream"] }
futures-util = "0.3.32"
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }
getrandom = "0.4.3"
