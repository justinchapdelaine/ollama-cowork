[package]
name = "ollama-cowork-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ollama_cowork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
ollama-cowork-core = { path = "../../../crates/cowork-core" }
ollama-cowork-runtime = { path = "../../../crates/cowork-runtime" }
ollama-cowork-broker-transport = { path = "../../../crates/broker-transport" }
ollama-cowork-opencode-client = { path = "../../../crates/opencode-client" }
serde.workspace = true
tauri = { version = "=2.11.5", features = [] }
